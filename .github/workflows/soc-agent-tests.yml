name: SOC Agent checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -c scripts/requirements.txt requests fastapi httpx==0.28.1 opensearch-py python-dotenv
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Run investigation policy tests
        working-directory: scripts
        run: python -m unittest discover -s tests -v
      - name: Run GRC and SOC integration tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js for dashboard interaction checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dashboard test dependency
        run: npm install --no-save --ignore-scripts --prefix /tmp/sham-ui jsdom@31.0.1
      - name: Check dashboard interactions with isolated synthetic data
        env:
          SOC_JSDOM_PATH: /tmp/sham-ui/node_modules/jsdom
        run: |
          python tests/workspace_ui_fixture.py /tmp/sham-ui-fixture
          node tests/case_workspace_ui.cjs /tmp/sham-ui-fixture
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install security checks
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit pinned runtime packages
        # SHAM uses Chroma only as an embedded PersistentClient. The four
        # advisories below concern the Chroma HTTP server and its authorization.
        run: >-
          python -m pip_audit --no-deps --disable-pip -r scripts/requirements.txt
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
      - name: Scan for high-severity Python findings
        run: python -m bandit -r scripts -x scripts/tests -lll -ii
